[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralingua-launcher"
version = "0.2.0"
description = "Web UI that configures and launches TerraLingua simulations"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pyyaml",
    "litellm",
]

[project.scripts]
terralingua-launcher = "terralingua_launcher.server:main"

[tool.setuptools]
packages = ["terralingua_launcher"]

[tool.setuptools.package-data]
terralingua_launcher = ["static/*"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["terralingua_launcher"]
